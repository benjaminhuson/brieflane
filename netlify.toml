[build]
  publish = "public"
  command = "echo 'No build step: static PWA + functions'"

[functions]
  node_bundler = "esbuild"
  # Local-dev database engine; never needed in production.
  external_node_modules = ["@electric-sql/pglite"]
  # Netlify's file tracer misses the Postgres driver (required inside src/db.js), so ship it explicitly
  # and leave out the 17MB local-only PGlite engine.
  included_files = ["node_modules/postgres/**", "!node_modules/@electric-sql/**"]

# Security headers for the static app shell (API responses set their own).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://accounts.google.com; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
